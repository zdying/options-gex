<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GravityFlow 引力流</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="识别价格容易被吸引、拉扯或释放波动的位置">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="app-container">

    <!-- 1. 顶部 Header 区 -->
    <header class="glass-panel">
      <div class="brand">
        <div class="brand-logo"></div>
        <div>
          <h1>GRAVITYFLOW 引力流</h1>
          <span>Price Gravity • Intraday Flow Shift</span>
        </div>
      </div>

      <div class="simulation-clock">
        <div class="time-progressbar-container">
          <div id="timeProgressBar" class="time-progressbar"></div>
        </div>
        <div>
          <span class="metric-label" style="font-size: 10px; display: block; text-align: right;">Simulated Time</span>
          <div id="simClock" class="timer-clock">09:30:00</div>
        </div>
      </div>
    </header>

    <!-- 2. 控制面板 -->
    <section class="glass-panel control-bar">
      <div class="selection-group">
        <span class="metric-label">Ticker:</span>
        <div class="select-wrapper">
          <select id="tickerSelect">
            <option value="AAPL">AAPL (Apple)</option>
          </select>
        </div>
      </div>

      <div class="btn-group">
        <button id="startBtn" class="active-btn">
          <span style="font-size: 10px;">▶</span> Start Simulation
        </button>
        <button id="pauseBtn">
          <span style="font-size: 10px;">❚❚</span> Pause
        </button>
        <button id="resetBtn" class="danger-btn">
          <span style="font-size: 10px;">↺</span> Reset
        </button>
      </div>

      <div class="speed-control">
        <span class="metric-label">Speed:</span>
        <div class="select-wrapper">
          <select id="speedSelect">
            <option value="1">1x (Real-time)</option>
            <option value="10">10x Speed</option>
            <option value="60" selected>60x Speed</option>
            <option value="300">300x Speed</option>
            <option value="600">600x Speed</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 3. 核心指标看板 -->
    <section class="metrics-grid">
      <div class="glass-panel metric-card gold">
        <span class="metric-label">Spot</span>
        <div class="metric-val" id="spotVal">$0.00</div>
        <div class="metric-sub">
          <span>盘中引力偏移:</span>
          <span id="gravityShiftVal" style="color: #fff; font-weight: 600;">$0.00</span>
        </div>
      </div>

      <div class="glass-panel metric-card green" id="referenceCard">
        <span class="metric-label">引力参考度</span>
        <div class="metric-val" id="gravityReferenceVal">--</div>
        <div class="metric-sub">
          <span id="gravityReferenceNote">等待数据</span>
        </div>
      </div>

      <div class="glass-panel metric-card green" id="influenceCard">
        <span class="metric-label">开盘引力</span>
        <div class="metric-val" id="openingGravityVal">$0.00</div>
        <div class="metric-sub">
          <span>开盘价格力场在当前价格的投影</span>
        </div>
      </div>

      <div class="glass-panel metric-card cyan">
        <span class="metric-label">实时引力</span>
        <div class="metric-val" id="liveGravityVal">$0.00</div>
        <div class="metric-sub">
          <span>盘中引力修正后的实时状态</span>
        </div>
      </div>

      <div class="glass-panel metric-card rose" id="wallsCard">
        <span class="metric-label">引力区间</span>
        <div class="metric-val" id="wallsVal">-- / --</div>
        <div class="metric-sub">
          <span id="gravityAxisVal">引力中轴: --</span>
        </div>
      </div>
    </section>

    <!-- 4. 双图表展示区 -->
    <section class="charts-grid">
      <!-- 引力分布图 -->
      <div class="glass-panel">
        <div class="chart-header">
          <h3 class="chart-title" id="gravityChartTitle">引力分布图</h3>
          <div class="chart-actions" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <select id="rangeFilter"
              style="background: rgba(30, 41, 59, 0.7); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); padding: 4px 8px; border-radius: 4px; outline: none; font-size: 13px; cursor: pointer;">
              <option value="all">全部引力</option>
              <option value="today">当日引力</option>
              <option value="near">近端引力</option>
            </select>
          </div>
        </div>
        <div class="chart-wrapper">
          <canvas id="gravityChart"></canvas>
        </div>
      </div>

      <div class="glass-panel">
        <div class="chart-header">
          <h3 class="chart-title">盘中引力变化</h3>
        </div>
        <div class="chart-wrapper">
          <canvas id="historyChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 5. 引力流说明面板 -->
    <section class="glass-panel analysis-panel">
      <div class="analysis-header">
        <h3 class="analysis-title">
          引力流提示
        </h3>
        <div id="statusBadge" class="status-badge badge-neutral">引力流</div>
      </div>
      <div id="modelNoteContent" class="report-content">引力流为模型估算值，引力位不是预测目标，而是需要重点观察的关键价格。</div>
    </section>

  </div>

  <!-- Main Application Script -->
  <script src="js/app.js"></script>
</body>

</html>
